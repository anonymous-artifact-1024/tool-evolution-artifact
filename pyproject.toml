[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-evolution-artifact"
version = "1.0.0"
description = "Code and analysis-ready data for an anonymous tool-evolution study"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-c==0.24.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
figures = ["matplotlib>=3.8,<4"]
reference-tokenizer = ["transformers==4.57.1", "jinja2==3.1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
